<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="SimpoChat — group-first conversations and temporary posts.">
  <title>SimpoChat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="ambient ambient-c"></div>

  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <div class="brand-name">SimpoChat</div>
          <div class="brand-subtitle" id="screenSubtitle">Your groups</div>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" data-action="open-posts" aria-label="Posts" title="Posts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.8h10A3.2 3.2 0 0 1 20.2 7v10a3.2 3.2 0 0 1-3.2 3.2H7A3.2 3.2 0 0 1 3.8 17V7A3.2 3.2 0 0 1 7 3.8Z"/><path d="m10 8 6 4-6 4V8Z"/></svg>
        </button>
        <button class="icon-btn" data-action="open-search" aria-label="Search" title="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.2 4.2"/></svg>
        </button>
        <button class="icon-btn" data-action="open-menu" aria-label="Menu" title="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
        </button>
      </div>
    </header>

    <main id="screen" class="screen" tabindex="-1"></main>

    <button class="fab" data-action="join-group" aria-label="Find and join a group" title="Find and join a group">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-btn" data-screen="archived" aria-label="Archived">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.2h16v12H4z"/><path d="M3 4.8h18v3H3zM9 11.2h6"/></svg>
      </button>
      <button class="nav-btn active" data-screen="home" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4.5 10.6 7.5-6 7.5 6v8.2a1.7 1.7 0 0 1-1.7 1.7H6.2a1.7 1.7 0 0 1-1.7-1.7z"/><path d="M9.2 20.5v-5.4h5.6v5.4"/></svg>
      </button>
      <button class="nav-btn" data-screen="starred" aria-label="Starred">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <script src="app.js"></script>
</body>
</html>
