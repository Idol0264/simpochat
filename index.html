<!doctype html>
<html lang="en" data-theme="system">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f4f6fa"
  >

  <meta
    name="description"
    content="SimpoChat — group-first conversations and temporary posts."
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>SimpoChat</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <div id="app">

    <!-- =========================
         MAIN APPLICATION
    ========================== -->

    <div class="app-shell">

      <!-- =========================
           HEADER
      ========================== -->

      <header class="app-header">

        <div class="header-row">

          <div class="brand">

            <h1 class="brand-name">
              SimpoChat
            </h1>

            <p id="screenSubtitle">
              Your groups
            </p>

          </div>


          <div class="header-actions">

            <!-- Posts / Status -->
            <button
              class="icon-btn"
              data-action="open-posts"
              aria-label="Posts"
              title="Posts"
            >

              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
              >
                <rect
                  x="3.5"
                  y="3.5"
                  width="17"
                  height="17"
                  rx="4"
                />

                <path
                  d="m10 8 6 4-6 4V8Z"
                  fill="currentColor"
                  stroke="none"
                />
              </svg>

            </button>


            <!-- Search -->
            <button
              class="icon-btn"
              data-action="open-search"
              aria-label="Search"
              title="Search"
            >

              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
              >
                <circle
                  cx="10.8"
                  cy="10.8"
                  r="6.7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <path
                  d="m16 16 4.2 4.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>

            </button>


            <!-- Main menu -->
            <button
              class="icon-btn"
              data-action="open-menu"
              aria-label="Menu"
              title="Menu"
            >

              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                aria-hidden="true"
              >
                <path
                  d="M5 7h14M5 12h14M5 17h14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>

            </button>

          </div>

        </div>

      </header>


      <!-- =========================
           SCREEN CONTENT
      ========================== -->

      <main
        id="screen"
        tabindex="-1"
      ></main>


      <!-- =========================
           FLOATING NEW/JOIN BUTTON
      ========================== -->

      <button
        class="fab"
        data-action="join-group"
        aria-label="Find and join a group"
        title="Find and join a group"
      >

        <svg
          viewBox="0 0 24 24"
          width="25"
          height="25"
          aria-hidden="true"
        >
          <path
            d="M12 5v14M5 12h14"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
        </svg>

      </button>


      <!-- =========================
           BOTTOM NAVIGATION
           Icons only — no text
      ========================== -->

      <nav
        class="bottom-nav"
        aria-label="Primary navigation"
      >

        <!-- Archived -->
        <button
          class="nav-btn"
          data-nav="archived"
          aria-label="Archived"
          title="Archived"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
            >
              <path
                d="M4 7.2h16v12H4z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              />

              <path
                d="M3 4.8h18v3H3zM9 11.2h6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </span>

        </button>


        <!-- Home -->
        <button
          class="nav-btn active"
          data-nav="home"
          aria-label="Home"
          title="Home"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
            >
              <path
                d="m4.5 10.6 7.5-6 7.5 6v8.2a1.7 1.7 0 0 1-1.7 1.7H6.2a1.7 1.7 0 0 1-1.7-1.7z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />

              <path
                d="M9.2 20.5v-5.4h5.6v5.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
              />
            </svg>
          </span>

        </button>


        <!-- Starred -->
        <button
          class="nav-btn"
          data-nav="starred"
          aria-label="Starred"
          title="Starred"
        >

          <span
            class="nav-icon"
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
            >
              <path
                d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
            </svg>
          </span>

        </button>

      </nav>

    </div>

  </div>


  <!-- =========================
       MODAL LAYER
  ========================== -->

  <div id="modal-root"></div>


  <!-- =========================
       APPLICATION SCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
