
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#7040ff"
  >

  <title>SimpoChat — Connection Problem</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at 50% 20%,
          #44218f,
          transparent 45%
        ),
        linear-gradient(
          145deg,
          #130d27,
          #080811 75%
        );
    }

    .offline-card {
      width: 100%;
      max-width: 360px;

      padding: 32px 24px;

      text-align: center;

      border-radius: 28px;

      background:
        rgba(27, 23, 43, .92);

      border: 1px solid
        rgba(155, 112, 255, .25);

      box-shadow:
        0 20px 60px
          rgba(0, 0, 0, .35);
    }

    .offline-icon {
      width: 76px;
      height: 76px;

      display: grid;
      place-items: center;

      margin: 0 auto 24px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          #7040ff,
          #a05cff
        );

      font-size: 35px;
      font-weight: 900;
    }

    h1 {
      margin: 0;

      font-size: 25px;
      font-weight: 850;

      letter-spacing: -.5px;
    }

    p {
      margin: 13px 0 26px;

      color: #b8b2ca;

      font-size: 14px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      min-height: 52px;

      border: 0;
      border-radius: 16px;

      color: white;

      background:
        linear-gradient(
          135deg,
          #7040ff,
          #9b5cff
        );

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .brand {
      margin-top: 24px;

      color: #77718d;

      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="offline-card">

    <div class="offline-icon">
      S
    </div>

    <h1>Poor internet connection</h1>

    <p>
      Check your internet connection
      and try again.
    </p>

    <button
      type="button"
      onclick="window.location.reload()"
    >
      Try Again
    </button>

    <div class="brand">
      SIMPOCHAT
    </div>

  </main>
</body>
</html>
