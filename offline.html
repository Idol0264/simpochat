
<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f4f6fa"
    id="simpoOfflineThemeColor"
  >

  <title>SimpoChat — Connection Problem</title>

  <script>
    (function () {
      try {
        const savedTheme =
          localStorage.getItem("simpochat-theme");

        document.documentElement.dataset.theme =
          savedTheme || "system";
      } catch (error) {
        document.documentElement.dataset.theme =
          "system";
      }
    })();
  </script>

  <style>
    :root {
      color-scheme: light;

      --bg: #f4f6fa;
      --surface: rgba(255, 255, 255, .94);
      --text: #11141a;
      --muted: #687080;
      --line: rgba(20, 24, 35, .10);
      --accent: #6d4aff;
      --accent-2: #a56cff;
    }

    html[data-theme="dark"] {
      color-scheme: dark;

      --bg: #090a0f;
      --surface: rgba(27, 29, 37, .95);
      --text: #f5f6fa;
      --muted: #9299a8;
      --line: rgba(255, 255, 255, .08);
    }

    @media (prefers-color-scheme: dark) {
      html[data-theme="system"] {
        color-scheme: dark;

        --bg: #090a0f;
        --surface: rgba(27, 29, 37, .95);
        --text: #f5f6fa;
        --muted: #9299a8;
        --line: rgba(255, 255, 255, .08);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        24px 20px
        max(24px, env(safe-area-inset-bottom));

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 5%,
          rgba(109, 74, 255, .10),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(165, 108, 255, .09),
          transparent 30%
        ),
        var(--bg);

      transition:
        background .2s ease,
        color .2s ease;
    }

    .offline-card {
      width: 100%;
      max-width: 370px;

      padding: 32px 24px;

      text-align: center;

      border-radius: 28px;

      background: var(--surface);

      border: 1px solid var(--line);

      box-shadow:
        0 20px 60px
        rgba(15, 18, 30, .12);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .offline-icon {
      width: 76px;
      height: 76px;

      display: grid;
      place-items: center;

      margin: 0 auto 24px;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      color: white;

      font-size: 35px;
      font-weight: 900;

      box-shadow:
        0 12px 30px
        rgba(112, 64, 255, .22);
    }

    h1 {
      margin: 0;

      font-size: 25px;
      font-weight: 850;

      letter-spacing: -.5px;
    }

    p {
      margin: 13px 0 26px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      min-height: 52px;

      border: 0;
      border-radius: 16px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-2)
        );

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .brand {
      margin-top: 24px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="offline-card">

    <div class="offline-icon">S</div>

    <h1>Poor internet connection</h1>

    <p>
      Check your internet connection
      and try again.
      Your saved profile and session
      remain on this device.
    </p>

    <button
      type="button"
      onclick="window.location.reload()"
    >
      Try Again
    </button>

    <div class="brand">
      SIMPOCHAT
    </div>

  </main>
</body>
</html>
